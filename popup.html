<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FB Unlocker Pro</title>
  <style>
    :root {
      --bg: #0f1218;
      --card: #171c26;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #1877f2;
      --accent-glow: rgba(24, 119, 242, 0.35);
      --text: #f0f2f5;
      --muted: #9aa3b2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 310px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #1877f2, #0d47a1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .title-wrap h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .title-wrap span {
      font-size: 11px;
      color: #6ab0ff;
      font-weight: 600;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 42px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #2a313d;
      border-radius: 24px;
      transition: 0.2s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider {
      background-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      padding: 5px 0;
    }

    kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 11px;
      color: #6ab0ff;
    }

    .footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-dot {
      font-size: 11.5px;
      color: #31a24c;
      font-weight: 600;
    }

    .status-dot.off { color: var(--muted); }

    .btn-about {
      background: rgba(24, 119, 242, 0.15);
      color: #6ab0ff;
      border: 1px solid rgba(24, 119, 242, 0.35);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: 0.15s;
    }

    .btn-about:hover {
      background: rgba(24, 119, 242, 0.28);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">FB</div>
      <div class="title-wrap">
        <h1>FB Unlocker Pro</h1>
        <span>Version 2.2.0 • Pro Edition</span>
      </div>
    </div>
    <label class="switch" title="Enable or Disable Extension">
      <input type="checkbox" id="toggle-enabled" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="card">
    <div class="card-title">Quick Controls</div>
    <div class="row">
      <span>Preview Cover / Avatar</span>
      <kbd>Hover (0.2s)</kbd>
    </div>
    <div class="row">
      <span>Save Full Resolution</span>
      <kbd>D</kbd>
    </div>
    <div class="row">
      <span>Alternate Save Shortcut</span>
      <kbd>Ctrl + S</kbd>
    </div>
    <div class="row">
      <span>Dismiss Preview</span>
      <kbd>Esc</kbd>
    </div>
  </div>

  <div class="footer">
    <span id="status-text" class="status-dot">● Active on Facebook</span>
    <a href="credits.html" target="_blank" class="btn-about">About & Credits</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
